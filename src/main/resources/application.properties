# Aplicacao
quarkus.application.name=simulador-cxverso
quarkus.http.port=8080

# Datasource (H2 embarcado em arquivo - persiste entre execucoes)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/simulador
quarkus.datasource.username=sa
quarkus.datasource.password=

# Desabilita o continuous testing do dev mode (evita que os testes escrevam no banco de dev)
quarkus.test.continuous-testing=disabled

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.filter=org.caixaverso.simulador.api.OpenApiErrorFilter

# Perfil de teste: H2 em memoria, schema recriado a cada execucao
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:simulador-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
